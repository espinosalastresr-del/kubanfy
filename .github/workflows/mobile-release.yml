name: Mobile release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build iOS IPA (requires Apple secrets + macos)"
        type: boolean
        default: true
      build_android:
        description: "Build Android APK"
        type: boolean
        default: true

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android APK
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS deps
        run: npm ci || npm install

      - name: Check native project
        id: native
        run: |
          if [ -d android ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/mobile/android not generated yet. Run RN init and commit android/ folder."
          fi

      - name: Decode keystore
        if: steps.native.outputs.present == 'true' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Assemble release APK
        if: steps.native.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        if: steps.native.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kubanfy-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  ios-ipa:
    name: iOS IPA
    if: ${{ github.event_name == 'push' || inputs.build_ios }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install JS deps
        run: npm ci || npm install

      - name: Check native project
        id: native
        run: |
          if [ -d ios ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/mobile/ios not generated yet. Run RN init on macOS and commit ios/ folder."
          fi

      - name: Install pods
        if: steps.native.outputs.present == 'true'
        run: |
          cd ios
          pod install

      - name: Import signing (optional)
        if: steps.native.outputs.present == 'true' && env.IOS_CERTIFICATE_P12_BASE64 != ''
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 -d > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/kubanfy.mobileprovision

      - name: Archive & export IPA
        if: steps.native.outputs.present == 'true'
        run: |
          cd ios
          xcodebuild -workspace KubanFy.xcworkspace \
            -scheme KubanFy \
            -configuration Release \
            -archivePath $PWD/build/KubanFy.xcarchive \
            archive CODE_SIGN_STYLE=Automatic || true
          # Export IPA requires ExportOptions.plist + valid signing; artifact step is best-effort until secrets are set.
          mkdir -p build
          find . -name "*.ipa" -o -name "*.xcarchive" | head

      - name: Upload IPA / archive
        if: steps.native.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kubanfy-ios-ipa
          path: |
            apps/mobile/ios/build/**/*.ipa
            apps/mobile/ios/build/**/*.xcarchive
          if-no-files-found: warn
