name: Mobile release (APK + IPA)

# Builds always run on GitHub Actions.
# - Tags v*: release artifacts + GitHub Release
# - workflow_dispatch: on-demand
# - push to main (apps/mobile): Android APK (debug if no keystore)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build iOS IPA"
        type: boolean
        default: true
      build_android:
        description: "Build Android APK"
        type: boolean
        default: true

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  RN_VERSION: "0.76.5"

jobs:
  android:
    name: Android APK (GitHub Actions)
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci || npm install

      - name: Ensure native android/ project
        run: |
          if [ -d android ] && [ -f android/gradlew ]; then
            echo "Native android/ already in repo"
          else
            echo "Scaffolding android/ via RN CLI in CI…"
            npx --yes @react-native-community/cli@15.1.3 init KubanFyCI \
              --version "${RN_VERSION}" \
              --skip-install \
              --pm npm \
              --directory /tmp/KubanFyCI
            rm -rf android
            cp -R /tmp/KubanFyCI/android ./android
            if [ -f android/app/build.gradle ]; then
              sed -i 's/applicationId "[^"]*"/applicationId "com.kubanfy.app"/' android/app/build.gradle || true
            fi
          fi
          chmod +x android/gradlew

      - name: Decode release keystore (optional)
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 — building debug APK"
          fi

      - name: Build release APK
        if: steps.sign.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (no secrets)
        if: steps.sign.outputs.signed != 'true'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubanfy-android-${{ github.ref_name }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

  ios:
    name: iOS IPA (GitHub Actions)
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_ios)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install JS dependencies
        run: npm ci || npm install

      - name: Ensure native ios/ project
        run: |
          if [ -d ios ]; then
            echo "ios/ present"
          else
            npx --yes @react-native-community/cli@15.1.3 init KubanFyCI \
              --version "${RN_VERSION}" \
              --skip-install \
              --pm npm \
              --directory /tmp/KubanFyCI
            rm -rf ios
            cp -R /tmp/KubanFyCI/ios ./ios
          fi

      - name: CocoaPods
        run: cd ios && pod install

      - name: Import Apple signing
        id: apple
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "${IOS_CERTIFICATE_P12_BASE64}" ] || [ -z "${IOS_PROVISIONING_PROFILE_BASE64}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing iOS secrets — unsigned archive attempt"
            exit 0
          fi
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 -d > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "${IOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/kubanfy.mobileprovision
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Archive + export IPA
        continue-on-error: true
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/{getline; print; exit}' | xargs)
          echo "Workspace=$WORKSPACE Scheme=$SCHEME"
          mkdir -p build
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -archivePath "$PWD/build/KubanFy.xcarchive" -destination "generic/platform=iOS" archive \
            CODE_SIGNING_ALLOWED=YES || \
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -archivePath "$PWD/build/KubanFy.xcarchive" -destination "generic/platform=iOS" archive \
            CODE_SIGNING_ALLOWED=NO || true
          cat > ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          if [ -d build/KubanFy.xcarchive ]; then
            xcodebuild -exportArchive -archivePath "$PWD/build/KubanFy.xcarchive" \
              -exportPath "$PWD/build/ipa" -exportOptionsPlist ExportOptions.plist || true
          fi

      - name: Upload IPA / archive
        uses: actions/upload-artifact@v4
        with:
          name: kubanfy-ios-${{ github.ref_name }}
          path: |
            apps/mobile/ios/build/ipa/*.ipa
            apps/mobile/ios/build/**/*.xcarchive
          if-no-files-found: warn
          retention-days: 30

  github-release:
    name: Attach artifacts to GitHub Release
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
