name: Temporary Ruff cleanup

on:
  push:
    branches: ["feat/release-track-management"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8.0"
      - name: Fix lint and format
        working-directory: apps/api
        run: |
          ruff check app tests --fix
          ruff format app tests
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api
          git commit -m "style: normalize Ruff formatting and imports"
          git push
