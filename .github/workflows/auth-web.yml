name: Auth Web CI and Deploy

on:
  push:
    branches: [KubanFy-auth-recovery, KubanFy-definitive]
    paths:
      - "apps/auth-web/**"
      - ".github/workflows/auth-web.yml"
  pull_request:
    branches: [KubanFy-definitive]
    paths:
      - "apps/auth-web/**"
      - ".github/workflows/auth-web.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auth-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/KubanFy-definitive'
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/auth-web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production assets
        run: npm run build
      - name: Deploy static SPA to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
      - name: Skip deployment if Cloudflare credentials are unavailable
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Web build passed. Cloudflare deployment is skipped until credentials are configured."
