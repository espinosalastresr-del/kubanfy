name: Temporary Ruff autofix

on:
  push:
    branches: ["feat/release-track-management"]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.8.0"

      - name: Apply safe Ruff fixes
        working-directory: apps/api
        run: ruff check app tests --fix

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff autofixes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api
          git commit -m "style: apply Ruff safe autofixes"
          git push
