name: KubanFy 2 Auth CI/CD

on:
  push:
    branches: [KubanFy-definitive]
    paths: ["apps/api-v2/**", ".github/workflows/auth-v2.yml"]
  pull_request:
    branches: [KubanFy-definitive]
    paths: ["apps/api-v2/**", ".github/workflows/auth-v2.yml"]
  workflow_dispatch:

concurrency:
  group: kubanfy-auth-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test, migrate, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-v2
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubanfy
          POSTGRES_PASSWORD: kubanfy
          POSTGRES_DB: kubanfy_auth_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubanfy -d kubanfy_auth_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://kubanfy:kubanfy@localhost:5432/kubanfy_auth_v2
      DATABASE_URL_SYNC: postgresql+psycopg://kubanfy:kubanfy@localhost:5432/kubanfy_auth_v2
      COOKIE_SECURE: "false"
      TRUST_CLOUDFLARE_HEADERS: "false"
      TERMS_VERSION: ci-test-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api-v2/pyproject.toml
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Alembic migration smoke test
        run: alembic upgrade head
      - name: Authentication and health tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Cloudflare Container image
        run: docker build --platform linux/amd64 -t kubanfy-auth-v2:ci -f Dockerfile .

  deploy:
    name: Deploy isolated auth service to Cloudflare Containers
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: apps/api-v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip deployment until required secrets are configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.NEON_DATABASE_URL == ''
        run: echo "::notice::CI passed. Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and NEON_DATABASE_URL repository secrets to enable deployment."
      - name: Install migration dependencies
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.NEON_DATABASE_URL != ''
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Apply migrations to the isolated Neon branch
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.NEON_DATABASE_URL != ''
        env:
          DATABASE_URL_SYNC: ${{ secrets.NEON_DATABASE_URL }}
        run: alembic upgrade head
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.NEON_DATABASE_URL != ''
        with:
          node-version: "22"
      - name: Install Worker dependencies
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.NEON_DATABASE_URL != ''
        run: npm install --no-audit --no-fund
      - name: Deploy Worker and Container
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.NEON_DATABASE_URL != ''
        run: |
          npx wrangler deploy
          printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL
          if [ -n "$CORS_ORIGINS" ]; then
            printf '%s' "$CORS_ORIGINS" | npx wrangler secret put CORS_ORIGINS
          fi
          npx wrangler deploy
