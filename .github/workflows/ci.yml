name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubanfy
          POSTGRES_PASSWORD: kubanfy
          POSTGRES_DB: kubanfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubanfy -d kubanfy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://kubanfy:kubanfy@localhost:5432/kubanfy_test
      DATABASE_URL_SYNC: postgresql://kubanfy:kubanfy@localhost:5432/kubanfy_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      SUPER_ADMIN_EMAIL: admin@test.local
      SUPER_ADMIN_PASSWORD: TestAdmin123!

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests
        continue-on-error: true

      - name: Unit tests
        run: pytest tests/ -q --tb=short

      - name: Alembic upgrade (smoke)
        run: alembic upgrade head

  docker-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [api-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile
        run: docker build -t kubanfy-api:ci -f apps/api/Dockerfile apps/api
