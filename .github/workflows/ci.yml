name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubanfy
          POSTGRES_PASSWORD: kubanfy
          POSTGRES_DB: kubanfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubanfy -d kubanfy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://kubanfy:kubanfy@localhost:5432/kubanfy_test
      DATABASE_URL_SYNC: postgresql://kubanfy:kubanfy@localhost:5432/kubanfy_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      SUPER_ADMIN_EMAIL: admin@test.local
      SUPER_ADMIN_PASSWORD: TestAdmin123!

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --fix app tests && ruff check app tests

      - name: Unit tests
        run: pytest tests/ -q --tb=short

      - name: Alembic upgrade (smoke)
        run: alembic upgrade head

  docker-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [api-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile
        run: docker build -t kubanfy-api:ci -f apps/api/Dockerfile apps/api

  web-build:
    name: Web PWA build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate
      - name: Install dependencies
        run: corepack pnpm install --no-frozen-lockfile --allow-build=esbuild --allow-build=unrs-resolver --allow-build=workerd
      - name: Build PWA
        run: pnpm build

  deploy-cloudflare-staging:
    name: Deploy Cloudflare API staging
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/cloudflare-containers-deploy'
    needs: [api-tests, docker-api, web-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/cloudflare/kubanfy-api-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: 692849a1e51eea43c2ddbf3cddc42f6f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"

      - name: Install Wrangler dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and Container image to Cloudflare
        run: npx wrangler deploy
