# Temporary Render-only staging environment for iOS integration testing.
# This Blueprint manages the existing staging resources created in Render.
services:
  - type: web
    name: kubanfy-api-staging
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/espinosalastresr-del/kubanfy
    branch: feat/release-track-management
    buildCommand: cd apps/api && pip install .
    startCommand: cd apps/api && sh scripts/entrypoint.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: STAGING_USE_LOCAL_STORAGE
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://kubanfy-api-staging.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kubanfy-staging-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: kubanfy-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kubanfy-staging-cache
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: KBY_MASTER_KEY
        generateValue: true
      - key: DEFAULT_COUNTRY
        value: CU
      - key: RATE_LIMIT_FAIL_OPEN
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: FEATURE_MONETIZATION
        value: "false"
      - key: FEATURE_GOOGLE_PLAY
        value: "false"
      - key: FEATURE_PROVIDER_YOUTUBE
        value: "false"
      - key: SUPER_ADMIN_EMAIL
        value: admin@kubanfy.staging
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
      - key: KUBANFY_SEED_DEMO_AUDIO
        value: "true"

  - type: keyvalue
    name: kubanfy-staging-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList:
      - source: 0.0.0.0/0
        description: temporary staging access

databases:
  - name: kubanfy-staging-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
