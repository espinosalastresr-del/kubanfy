[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubanfy-auth-api"
version = "0.1.0"
description = "Isolated KubanFy 2 authentication API"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14,<2", "argon2-cffi>=23.1,<26", "asyncpg>=0.30,<1", "email-validator>=2.2,<3", "fastapi>=0.115,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0,<3", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
