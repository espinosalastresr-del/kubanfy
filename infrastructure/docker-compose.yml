# KubanFy local / staging stack
# Usage:
#   docker compose -f infrastructure/docker-compose.yml up -d
#   docker compose -f infrastructure/docker-compose.yml --profile full up -d
#   docker compose -f infrastructure/docker-compose.yml --profile staging up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: kubanfy-postgres
    environment:
      POSTGRES_USER: kubanfy
      POSTGRES_PASSWORD: kubanfy
      POSTGRES_DB: kubanfy
    ports:
      - "5432:5432"
    volumes:
      - kubanfy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubanfy -d kubanfy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kubanfy-redis
    ports:
      - "6379:6379"
    volumes:
      - kubanfy_redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: kubanfy-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kubanfy_minio:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    profiles:
      - full
      - staging

  mailpit:
    image: axllent/mailpit:latest
    container_name: kubanfy-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    profiles:
      - full

  api:
    profiles: ["staging"]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: kubanfy-api
    command: ["sh", "scripts/entrypoint.sh"]
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://kubanfy:kubanfy@postgres:5432/kubanfy
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-staging-must-be-long-enough-32chars
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/storage
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - kubanfy_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  worker:
    profiles: ["staging"]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: kubanfy-worker
    command: ["python", "-m", "app.workers.runner"]
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://kubanfy:kubanfy@postgres:5432/kubanfy
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-staging-must-be-long-enough-32chars
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/storage
    volumes:
      - kubanfy_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kubanfy_pgdata:
  kubanfy_redis:
  kubanfy_minio:
  kubanfy_storage:
