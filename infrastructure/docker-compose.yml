# KubanFy local development stack
# Usage: docker compose -f infrastructure/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: kubanfy-postgres
    environment:
      POSTGRES_USER: kubanfy
      POSTGRES_PASSWORD: kubanfy
      POSTGRES_DB: kubanfy
    ports:
      - "5432:5432"
    volumes:
      - kubanfy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubanfy -d kubanfy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kubanfy-redis
    ports:
      - "6379:6379"
    volumes:
      - kubanfy_redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional S3-compatible storage for local R2 simulation
  minio:
    image: minio/minio:latest
    container_name: kubanfy-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kubanfy_minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    profiles:
      - full

  # Mailpit for local email capture
  mailpit:
    image: axllent/mailpit:latest
    container_name: kubanfy-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped
    profiles:
      - full

volumes:
  kubanfy_pgdata:
  kubanfy_redis:
  kubanfy_minio:

  # --- Staging-oriented API (profile: staging) ---
  # Usage: docker compose -f infrastructure/docker-compose.yml --profile staging up -d
  api:
    profiles: ["staging"]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: kubanfy-api-staging
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://kubanfy:kubanfy@postgres:5432/kubanfy
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-staging-must-be-long-enough-32chars
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
